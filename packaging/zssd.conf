# /etc/zss/zssd.conf: settings for zssd. Restart the service after editing.
# Every setting can also be given on the command line as --name-with-dashes.

# The GPU to manage, by PCI address. The power backend is detected; to force
# one, write PCI=apple-gmux, PCI=pciehp-slot or PCI=dry-run. May be repeated.
#gpu = 0000:01:00.0

# Power an unused GPU off after this many seconds. Unset: only on request
# (zssctl off). It is switched back on by itself when something needs it.
#idle_timeout = 300

# Services that hold the GPU only to keep it initialised. They are stopped
# before a power-off and started again afterwards.
stop_services = nvidia-persistenced

# While a GPU is off because you asked, hide it from programs started
# meanwhile: auto (its device nodes and its vendor driver's files), no, or a
# comma-separated list of extra paths to hide as well.
#hide_while_off = auto

# Where applications go when the GPU is powered off: a PCI address,
# "software", or unset to let zssd pick another GPU.
#default_target = 0000:00:02.0

# Let applications fall back to a software renderer when no GPU suits them.
#allow_software = yes

# Members of this group may switch GPUs off and on.
group = zss
